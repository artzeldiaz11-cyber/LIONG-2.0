{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIONG Garment</title>

  <!-- Styles -->
  <link rel="stylesheet" href="{% static 'css/admin-style.css' %}">

  <!-- Modern icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    .home-page {
      display: flex;
      min-height: 60vh;
      font-family: Arial, sans-serif;
    }

    .home-left {
      flex: 1;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .home-left .brand-container {
      text-align: center;
      margin-bottom: 30px;
    }

    .home-left .brand-logo {
      width: 120px;
      margin-bottom: 10px;
    }

    .home-left .brand-text {
      font-size: 28px;
      font-weight: bold;
      color: #333;
    }

    .home-left p {
      font-size: 16px;
      color: #555;
    }

    .home-right {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      flex-direction: column;
      gap: 20px;
    }

    .home-right h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .home-right .btn {
      width: 180px;
      padding: 12px 0;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      transition: 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-request {
      background-color: #3498db;
    }

    .btn-request:hover {
      background-color: #2980b9;
    }

    .btn-login {
      background-color: #2ecc71;
    }

    .btn-login:hover {
      background-color: #27ae60;
    }
  </style>
</head>

<body>
  <div class="home-page">

    <div class="home-left">
      <div class="brand-container">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="brand-logo">
        <div class="brand-text">LIONG GARMENT</div>
      </div>
      <p>Welcome! Choose your action.</p>
    </div>

    <div class="home-right">
      <h2>Get Started</h2>
       <a href="{% url 'normalRequest' %}" class="btn btn-request">
          <i class="fa-solid fa-file-lines"></i> Request
        </a>
        <a href="{% url 'admin_login' %}" class="btn btn-login">
          <i class="fa-solid fa-right-to-bracket"></i> Login
      </a>
    </div>

  </div>
</body>
</html>
